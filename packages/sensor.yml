globals:
  - id: total_energy
    type: float
    restore_value: yes
    initial_value: '0.0'

sensor:
  - platform: cse7766
    current:
      name: "Current"
      accuracy_decimals: 0
      filters:
        - multiply: 2.4
        - throttle: 10s

    voltage:
      name: "Voltage"
      accuracy_decimals: 0
      filters:
        - multiply: 2.4
        - throttle: 10s

    power:
      name: "Power"
      accuracy_decimals: 0
      filters:
        - multiply: 2.4
        - throttle: 1s

    energy:
      name: "Energy"
      id: energy
      unit_of_measurement: kWh
      filters:
        # Multiplication factor from W to kW is 0.001
        # and multiple by 2.4 because of the voltage factor
        - multiply: 0.0024
        - throttle: 1s
      on_value:
        then:
          - lambda: |-
              static float previous_energy_value = 0.0;
              float current_energy_value = id(energy).state;
              id(total_energy) += current_energy_value - previous_energy_value;
              previous_energy_value = current_energy_value;

  - platform: template
    name: "Total Energy"
    unit_of_measurement: kWh
    device_class: "energy"
    state_class: "total_increasing"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 3
    lambda: |-
      return id(total_energy);

