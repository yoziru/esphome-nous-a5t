# Physical master button: switches all four relays off. GPIO16 does not
# support interrupts on the ESP8266, so ESPHome polls this pin (a warning is
# logged at boot).
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO16
      # mode: INPUT_PULLUP
      inverted: True
    id: "button_state0"
    on_press:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - switch.turn_off: relay3
      - switch.turn_off: relay4
