# from https://github.com/esphome/workflows/blob/main/.github/workflows/publish.yml
name: Build and Publish ESPHome firmware with secrets.yaml

on:
  workflow_call:
    inputs:
      files:
        description: Comma-separated list of files to build.
        required: true
        type: string
      name:
        description: Name of the firmware to publish.
        required: false
        type: string
        default: ESPHome
      clean:
        description: Remove deleted files from the build
        required: false
        type: boolean
        default: true
      manifest_filename:
        description: Filename of the manifest to write.
        required: false
        type: string
        default: manifest.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files-array.outputs.files }}
    steps:
      - id: files-array
        run: |
          files=$(echo "${{ inputs.files }}" | jq -Rcn 'inputs | . / ","')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  build:
    name: Build ESPHome binary for ${{ matrix.file }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.prepare.outputs.files) }}
    outputs:
      esphome-version: ${{ steps.esphome-build.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Mock secrets.yaml from example
        run: cp secrets.yaml.example secrets.yaml
      - name: Get ESPHome version
        id: get_esphome_version
        # read esphome version from requirements.txt
        run: |
          esphome_version=$(grep esphome requirements.txt | cut -d'=' -f3)
          echo "esphome_version=$esphome_version" >> "$GITHUB_OUTPUT"
      - uses: esphome/build-action@v8.1.0
        id: esphome-build
        with:
          yaml-file: ${{ matrix.file }}
          version: ${{ steps.get_esphome_version.outputs.esphome_version }}
      - name: Move generated files to output
        run: |
          mkdir output
          mv "${{ steps.esphome-build.outputs.name }}" output/
          echo ${{ steps.esphome-build.outputs.version }} > output/version
          echo ${{ steps.esphome-build.outputs.project-version }} > output/project_version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.file }}
          path: output
          retention-days: 1

  publish:
    name: Publish new firmware and website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: output
      - name: Create single manifest.json
        run: |
          set -euo pipefail
          version=$(cat output/project_version)
          # Each build's manifest has binary paths relative to its own
          # directory, but the merged manifest lives at the site root. Prefix
          # them with the build directory, or ESP Web Tools requests
          # /<file>.bin instead of /<build-dir>/<file>.bin and gets a 404.
          for dir in output/*/; do
            build_name=$(basename "$dir")
            jq --arg n "$build_name" '
              (if .ota? and .ota.path? then .ota.path |= ($n + "/" + .) else . end)
              | (if .parts? then .parts |= map(.path |= ($n + "/" + .)) else . end)
            ' "$dir/manifest.json" > "$dir/manifest.prefixed.json"
          done
          jq -s --arg version "$version" '{"name": "${{ inputs.name }}", "version": $version, "home_assistant_domain": "esphome", "new_install_skip_erase": false, "builds":.}' output/*/manifest.prefixed.json > output/${{ inputs.manifest_filename }}
          # Intermediate files must not be published.
          rm -f output/*/manifest.prefixed.json
          # Every referenced binary must exist, or the install button 404s.
          jq -r '.builds[] | .ota.path?, .parts[]?.path' output/${{ inputs.manifest_filename }} | while read -r path; do
            test -f "output/$path" || { echo "Manifest references missing file: $path"; exit 1; }
          done

      - run: cp -R static/* output

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: output
          clean: ${{ inputs.clean }}
