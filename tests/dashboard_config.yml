# Mirrors the configuration materialized by ESPHome Device Builder for an adopted device.
substitutions:
  name: nous-a5t-dashboard-test
  friendly_name: Nous A5T Dashboard Test
  relay_restore_mode: RESTORE_DEFAULT_OFF
  ota_password: !secret test_ota_password

packages:
  nous_a5t: !include ../nous-a5t.dashboard.yml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret test_api_encryption_key

wifi:
  ssid: !secret test_wifi_ssid
  password: !secret test_wifi_password
